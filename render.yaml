# Déploiement Render (blueprint) : ECO NATION + base PostgreSQL.
# Render → New → Blueprint → sélectionner ce dépôt GitHub.
services:
  - type: web
    name: eco-nation
    runtime: node
    rootDir: eco-nation
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: eco-nation-db
          property: connectionString
databases:
  - name: eco-nation-db
    plan: free
