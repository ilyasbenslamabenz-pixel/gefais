  .inner{position:relative;z-index:1;flex:1;width:100%;max-width:1200px;margin:0 auto;padding:32px 40px 40px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.3px;}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0;max-width:620px;}
  .kicker{font-size:15px;font-weight:500;opacity:.9;margin:0 0 18px;}
  h1{font-family:'Archivo',sans-serif;font-size:76px;line-height:1;font-weight:800;letter-spacing:-2.5px;margin:0 0 24px;}
  .lead{font-size:18px;line-height:1.6;opacity:.92;margin:0 0 34px;max-width:500px;}
  .btn{display:inline-block;background:#d42a20;color:#fff;padding:16px 28px;border-radius:3px;font-size:15px;font-weight:600;transition:background .15s;}
  .btn:hover{background:#b8221a;}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.7);}
  .foot a{transition:color .15s;}
  .foot a:hover{color:#fff;}
  @keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.07)}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .content > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;}
  .content > *:nth-child(2){animation-delay:.12s;}
  .content > *:nth-child(3){animation-delay:.24s;}
  .content > *:nth-child(4){animation-delay:.36s;}
  @media (max-width:700px){
    .inner{padding:24px 22px 28px;}
    h1{font-size:46px;letter-spacing:-1.5px;}
    .lead{font-size:17px;}
  }
  @media (prefers-reduced-motion:reduce){
    .bg,.content > *{animation:none;}
  }

  /* ── Hors du tracé : la carte des maraudes ── */
  .carte404{margin:36px 0 0;width:min(100%,420px);border-radius:4px;overflow:hidden;background:#1d1d1b;box-shadow:0 30px 60px -30px rgba(0,0,0,.7);position:relative}
  .carte404 svg{display:block;width:100%;height:auto;aspect-ratio:660/540}
  .carte404 image{opacity:.85}
  .carte404 .trace{fill:none;stroke:#e5392d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .carte404 .arret{fill:#fff;stroke:#141414;stroke-width:4}
  .carte404 .errance{fill:none;stroke:rgba(255,255,255,.7);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round}
  .carte404 .retour{fill:none;stroke:#fdc915;stroke-width:4;stroke-dasharray:6 8;stroke-linecap:round}
  .carte404 .point{fill:#fdc915;stroke:#141414;stroke-width:3}
  .carte404 .halo{fill:rgba(253,201,21,.25);transform-box:fill-box;transform-origin:center;animation:halo 2s ease-out infinite}
  @keyframes halo{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
  .carte404 figcaption{position:absolute;left:12px;bottom:12px;font-size:12.5px;font-weight:600;background:rgba(20,20,20,.82);color:#fff;padding:6px 10px;border-radius:3px}
  .carte404 .ok{display:none;color:#fdc915}
  .carte404.revenu .ici{display:none}.carte404.revenu .ok{display:inline}
  @media (min-width:1000px){
    .carte404{position:absolute;right:40px;top:50%;transform:translateY(-50%) rotate(1.2deg);width:min(440px,36vw);margin:0}
  }
  @media (prefers-reduced-motion:reduce){.carte404 .halo{animation:none}}

<script>
/* Hors du tracé : le point égaré rejoint la ligne rouge quand on s'apprête à revenir */
(function(){
  var fig=document.querySelector('.carte404');if(!fig)return;
  var trace=fig.querySelector('.trace'),pt=fig.querySelector('.egare'),retour=fig.querySelector('.retour'),errance=fig.querySelector('.errance');
  var reduit=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var L=trace.getTotalLength();
  if(!reduit){trace.style.strokeDasharray=L;trace.style.strokeDashoffset=L;trace.getBoundingClientRect();trace.style.transition='stroke-dashoffset 2.4s cubic-bezier(.4,0,.2,1) .3s';trace.style.strokeDashoffset=0;}
  // errance : le point tourne sur lui-même à l'écart du tracé
  var t0=performance.now(),ancre=[690,612],revenu=false,raf;
  function errer(t){if(revenu)return;var a=(t-t0)/900;var x=ancre[0]+Math.cos(a)*14,y=ancre[1]+Math.sin(a*1.3)*10;pt.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');raf=requestAnimationFrame(errer);}
  if(!reduit)raf=requestAnimationFrame(errer);
  // point du tracé le plus proche
  var best=null;for(var s=0;s<=L;s+=4){var p=trace.getPointAtLength(s),d=Math.hypot(p.x-ancre[0],p.y-ancre[1]);if(!best||d<best.d)best={d:d,x:p.x,y:p.y};}
  function revenir(){
    if(revenu)return;revenu=true;cancelAnimationFrame(raf);
    var tr=pt.getAttribute('transform').match(/[-\d.]+/g).map(Number);
    retour.setAttribute('d','M'+tr[0]+' '+tr[1]+' L'+best.x.toFixed(1)+' '+best.y.toFixed(1));
    errance.style.transition='opacity .4s';errance.style.opacity=0;
    var dur=reduit?0:900,start=performance.now();
    (function step(t){var k=Math.min(1,(t-start)/(dur||1)),e=1-Math.pow(1-k,3);
      var x=tr[0]+(best.x-tr[0])*e,y=tr[1]+(best.y-tr[1])*e;pt.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
      if(k<1)requestAnimationFrame(step);else fig.classList.add('revenu');})(start);
  }
  var btn=document.getElementById('btn-retour');
  ['mouseenter','focus','touchstart'].forEach(function(ev){btn.addEventListener(ev,revenir,{passive:true});});
})();
</script>
