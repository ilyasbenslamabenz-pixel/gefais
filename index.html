<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="description" content="GE-FAIS, association genevoise. Notre site arrive bientôt.">
<meta name="theme-color" content="#141414">
<title>GE-FAIS — Bientôt en ligne</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230e0e18'/%3E%3Ccircle cx='20' cy='3' r='3.5' fill='%23fff' opacity='.9'/%3E%3Ccircle cx='28' cy='5' r='3' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='34' cy='11' r='2.5' fill='%23fff' opacity='.8'/%3E%3Ccircle cx='37' cy='19' r='2' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='34' cy='27' r='2' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='28' cy='33' r='2.5' fill='%23fff' opacity='.8'/%3E%3Ccircle cx='20' cy='37' r='3' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='12' cy='33' r='2.5' fill='%23fff' opacity='.8'/%3E%3Ccircle cx='6' cy='27' r='2' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='6' cy='19' r='3.5' fill='%23ff3b30'/%3E%3Ccircle cx='9' cy='11' r='3' fill='%23ffd60a'/%3E%3Ccircle cx='14' cy='5' r='2.5' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#1d1626;color:#fff;font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .page{position:relative;min-height:100%;display:flex;flex-direction:column;overflow:hidden;}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;animation:kenburns 24s ease-out infinite alternate;transform-origin:50% 60%;}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,10,16,.82) 0%,rgba(12,10,16,.55) 50%,rgba(12,10,16,.25) 100%),linear-gradient(0deg,rgba(12,10,16,.6) 0%,rgba(12,10,16,0) 45%);}
  .inner{position:relative;z-index:1;flex:1;width:100%;max-width:1200px;margin:0 auto;padding:32px 40px 40px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.3px;}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0;max-width:620px;}
  .kicker{font-size:15px;font-weight:500;opacity:.9;margin:0 0 18px;}
  h1{font-family:'Archivo',sans-serif;font-size:76px;line-height:1;font-weight:800;letter-spacing:-2.5px;margin:0 0 24px;}
  .lead{font-size:18px;line-height:1.6;opacity:.92;margin:0 0 34px;max-width:500px;}
  .btn{display:inline-block;background:#d42a20;color:#fff;padding:16px 28px;border-radius:6px;font-size:15px;font-weight:600;transition:background .15s;}
  .btn:hover{background:#b8221a;}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.7);}
  .foot a{transition:color .15s;}
  .foot a:hover{color:#fff;}
  @keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .content > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;}
  .content > *:nth-child(2){animation-delay:.12s;}
  .content > *:nth-child(3){animation-delay:.24s;}
  .content > *:nth-child(4){animation-delay:.36s;}
  @media (max-width:700px){
    .inner{padding:24px 22px 28px;}
    h1{font-size:46px;letter-spacing:-1.5px;}
    .lead{font-size:17px;}
  }
  @media (prefers-reduced-motion:reduce){
    .bg,.content > *{animation:none;}
  }
</style>
</head>
<body>
<div class="page">
  <img class="bg" src="images/geneve-jet-deau.webp" alt="">
  <div class="shade"></div>
  <div class="inner">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="3" r="3.5" fill="#fff"/>
        <circle cx="28" cy="5" r="3" fill="#fff" opacity=".85"/>
        <circle cx="34" cy="11" r="2.5" fill="#fff" opacity=".75"/>
        <circle cx="37" cy="19" r="2" fill="#fff" opacity=".65"/>
        <circle cx="34" cy="27" r="2" fill="#fff" opacity=".65"/>
        <circle cx="28" cy="33" r="2.5" fill="#fff" opacity=".75"/>
        <circle cx="20" cy="37" r="3" fill="#fff" opacity=".85"/>
        <circle cx="12" cy="33" r="2.5" fill="#fff" opacity=".75"/>
        <circle cx="6" cy="27" r="2" fill="#fff" opacity=".65"/>
        <circle cx="6" cy="19" r="3.5" fill="#ff3b30"/>
        <circle cx="9" cy="11" r="3" fill="#ffd60a"/>
        <circle cx="14" cy="5" r="2.5" fill="#fff"/>
      </svg>
      GE-FAIS
    </div>

    <main class="content">
      <p class="kicker">Association genevoise</p>
      <h1>Notre site arrive bientôt.</h1>
      <p class="lead">Nous préparons le nouveau site de GE-FAIS. En attendant, vous pouvez déjà nous rejoindre en remplissant le formulaire d'adhésion.</p>
      <div><a class="btn" href="adhesion.html">Devenir membre</a></div>
    </main>

    <div class="foot">
      <span>© 2026 Association GE-FAIS · « Ensemble, faisons qu'un »</span>
      <a href="gestion/">Accès comité</a>
    </div>
  </div>
</div>
</body>
</html>
